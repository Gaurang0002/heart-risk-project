<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="login-box">

        <h1>Heart Risk Prediction</h1>

        <h2>Forgot Password</h2>

        <p class="info">
            Enter your registered Gmail address.
            We will send you a 6-digit OTP.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter registered email"
                required
            >

            <button type="submit">
                Send OTP
            </button>

        </form>

        <div class="links">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
